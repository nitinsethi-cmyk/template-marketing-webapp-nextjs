fragment PageTopSectionFields on PageTopSectionItem {
  __typename
}

fragment PageContentFields on PagePageContent {
  __typename
}

fragment PageExtraSectionItemFields on PageExtraSectionItem {
  __typename
}

# Amplitude Contentful Variant Container
# @see https://amplitude.com/docs/feature-experiment/contentful
fragment VariantContainerFields on VariantContainer {
  __typename
  sys {
    id
  }
  experimentId
  meta
  experiment
  variantsCollection(limit: 20) {
    items {
      __typename
      ... on Entry {
        sys {
          id
        }
      }
      # Full-page experiments link a Page as the treatment entry
      ... on Page {
        slug
        pageName
        topSectionCollection(limit: 20) {
          items {
            ... on Entry {
              __typename
              sys {
                id
              }
            }
          }
        }
        pageContent {
          ... on Entry {
            __typename
            sys {
              id
            }
          }
        }
        extraSectionCollection(limit: 20) {
          items {
            ... on Entry {
              __typename
              sys {
                id
              }
            }
          }
        }
      }
    }
  }
}

fragment CtfPageFields on Page {
  __typename
  sys {
    id
  }
  pageName
  internalName: pageName
  slug
  seo {
    title
    description
    image {
      ...AssetFields
    }
    noIndex
    noFollow
  }
  topSectionCollection(limit: 20) {
    items {
      ... on Entry {
        __typename
        sys {
          id
        }
      }
      ...PageTopSectionFields
    }
  }
  pageContent {
    ... on Entry {
      __typename
      sys {
        id
      }
    }
    ...PageContentFields
  }
  # Contentful field holding the Amplitude VariantContainer for finance-hp on /black-card
  blackCardCtaText {
    ...VariantContainerFields
  }
  # Second independent experiment slot (finance-existing-customer)
  testSlot2 {
    ...VariantContainerFields
  }
  # Full-page experiment slot (contentful-page-test on /classic-card)
  pageExperiment {
    ...VariantContainerFields
  }
  extraSectionCollection(limit: 20) {
    items {
      ... on Entry {
        __typename
        sys {
          id
        }
      }
      ...PageExtraSectionItemFields
    }
  }
}

query CtfPage($slug: String!, $locale: String, $preview: Boolean) {
  pageCollection(where: { slug: $slug }, locale: $locale, preview: $preview, limit: 1) {
    items {
      ...CtfPageFields
    }
  }
}
